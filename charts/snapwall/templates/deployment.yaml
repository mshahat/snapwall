apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snapwall.fullname" . }}
  labels:
    {{- include "snapwall.labels" . | nindent 4 }}
spec:
  # A ReadWriteOnce volume attaches to one node at a time, so there is exactly
  # one replica and the old pod is stopped before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "snapwall.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "snapwall.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 15
      containers:
        - name: snapwall
          image: {{ include "snapwall.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: {{ include "snapwall.version" . | quote }}
            - name: IMAGE
              value: {{ include "snapwall.image" . | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.cluster.name | quote }}
            - name: APP_NAME
              value: {{ .Values.app.name | quote }}
            - name: EVENT_NAME
              value: {{ .Values.app.eventName | quote }}
            - name: HEADLINE
              value: {{ .Values.app.headline | quote }}
            - name: TAGLINE
              value: {{ .Values.app.tagline | quote }}
            - name: ACCENT
              value: {{ .Values.app.accent | quote }}
            - name: THEME
              value: {{ .Values.app.theme | quote }}
            - name: WRITE_INTERVAL
              value: {{ .Values.app.writeInterval | quote }}
            - name: DATA_DIR
              value: /data
            - name: PVC_NAME
              value: {{ ternary (include "snapwall.claimName" .) "emptyDir" .Values.persistence.enabled | quote }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "snapwall.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
