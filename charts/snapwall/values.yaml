image:
  repository: ghcr.io/mshahat/snapwall   # set to your registry
  tag: latest                          # empty = chart appVersion; shown on screen as the version (latest shows appVersion)
  pullPolicy: IfNotPresent                   # needed with latest, or nodes keep running a cached image

imagePullSecrets: []

# Per-cluster identity (cluster.name, ingress.host) lives in a ConfigMap that
# already exists in the release namespace; this chart never creates it.
# The pod reads both at start to show them on screen, and Helm reads ingress.host
# at install/upgrade to set the Ingress host. Examples: deploy/cluster-config/
clusterConfig:
  configMapName: snapwall-cluster

# Everything under `app` is rendered on the projector.
# Edit, commit, push — Flux rolls it out and the screen narrates the change.
app:
  name: SnapWall
  eventName: ".NEXT on Tour 🇿🇦"
  headline: "Run NKP"
  tagline: "AI Code Assisted . Built in minutes. Shipped by Git. Resilient Running anywhere."
  accent: "#007749"     # try "#8347FF" (Nutanix purple), "#007749" (SA green), "#FF9F0A" (orange) , "#0A84FF" (Blue)
  theme: dark           # dark | light
  writeInterval: 5      # seconds between heartbeats written to the volume

persistence:
  enabled: true         # false = emptyDir: photos and notes are lost when the pod goes away
  existingClaim: ""
  storageClass: ""      # empty = cluster default StorageClass
  accessMode: ReadWriteOnce
  size: 5Gi

service:
  type: ClusterIP       # LoadBalancer is handy on stage if the cluster has one
  port: 80

ingress:
  enabled: true
  className: "kommander-traefik"
  annotations: {}
  # ingress-nginx caps uploads at 1m by default; photos need more:
  #   nginx.ingress.kubernetes.io/proxy-body-size: 64m
  host: ""              # empty = ingress.host from the clusterConfig ConfigMap; if that's missing too, any hostname
  tls: []
  #  - secretName: snapwall-tls
  #    hosts: [snapwall.example.com]

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 384Mi

nodeSelector: {}
tolerations: []
affinity: {}
