# Apply once:  kubectl apply -f deploy/flux/snapwall.yaml
# From then on, Git is the only interface: edit charts/snapwall/values.yaml, commit, push.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: snapwall
  namespace: flux-system
spec:
  interval: 30s
  url: https://github.com/mshahat/snapwall   # your repo
  ref:
    branch: main
  ignore: |
    /*
    !/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapwall
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: snapwall
  releaseName: snapwall
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./charts/snapwall
      # Every new commit produces a new chart artifact, no version bump needed.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: snapwall
  values:
    image:
      repository: ghcr.io/mshahat/snapwall   # lowercase owner
    cluster:
      name: nkp-cluster                    # the name you want on screen
